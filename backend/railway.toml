# Railway service: Zuggernaut API (Express)
# Worker service: use backend/railway.worker.toml (see docs/DEPLOY.md §4)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
